
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>間違い探しタイム測定</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: sans-serif;
  background: #f3f5f7;
  color: #222;
}

main {
  max-width: 1100px;
  margin: auto;
}

h1 {
  text-align: center;
}

.panel {
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 15px;
  padding: 18px;
  margin-bottom: 20px;
  background: white;
  border-radius: 12px;
}

.timer {
  font-size: 36px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.count {
  font-size: 20px;
  font-weight: bold;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  background: #1674c0;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: default;
}

#reset {
  background: #555;
}

.hint {
  text-align: center;
  line-height: 1.7;
}

.puzzle {
  position: relative;
  width: 100%;
  line-height: 0;
}

.puzzle img {
  width: 100%;
  height: auto;
  display: block;
}

.target {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 5.5%;
  aspect-ratio: 1;
  padding: 0;
  border: 3px solid transparent;
  border-radius: 50%;
  background: transparent;
}

.target.found {
  border-color: #00a45a;
  background: #00a45a30;
}

#message {
  min-height: 30px;
  text-align: center;
  font-weight: bold;
  font-size: 18px;
}

@media (max-width: 600px) {
  body {
    padding: 8px;
  }

  .timer {
    font-size: 28px;
  }

  .count {
    font-size: 17px;
  }
}
</style>
</head>

<body>
<main>

<h1>間違い探しタイム測定</h1>

<div class="panel">
  <div>
    <div>経過時間</div>
    <div class="timer" id="timer">00:00.0</div>
  </div>

  <div class="count" id="count">
    見つけた間違い：0 / 8
  </div>

  <div>
    <button id="start">スタート</button>
    <button id="reset">やり直す</button>
  </div>
</div>

<p class="hint">
  左右の絵を見比べて、右側の絵の間違いをクリックしてください。<br>
  8個見つけるとタイマーが自動で止まります。
</p>

<div class="puzzle" id="puzzle">
  <img src="あ.webp" alt="間違い探しの問題">

  <!-- 正解位置：画像全体に対する割合 -->
  <button class="target" data-id="1"
    style="left:53.7%;top:48%;"
    aria-label="間違い1"></button>

  <button class="target" data-id="2"
    style="left:75.2%;top:37.7%;"
    aria-label="間違い2"></button>

  <button class="target" data-id="3"
    style="left:69.4%;top:70.8%;"
    aria-label="間違い3"></button>

  <button class="target" data-id="4"
    style="left:55%;top:85%;"
    aria-label="間違い4"></button>

  <button class="target" data-id="5"
    style="left:91.4%;top:42%;"
    aria-label="間違い5"></button>

  <button class="target" data-id="6"
    style="left:77.6%;top:51.9%;"
    aria-label="間違い6"></button>

  <button class="target" data-id="7"
    style="left:61.3%;top:35.2%;"
    aria-label="間違い7"></button>

  <button class="target" data-id="8"
    style="left:88.7%;top:16.7%;"
    aria-label="間違い8"></button>
</div>

<p id="message">スタートを押して始めてください。</p>

</main>

<script>
const timer = document.getElementById("timer");
const count = document.getElementById("count");
const message = document.getElementById("message");
const startButton = document.getElementById("start");
const resetButton = document.getElementById("reset");
const targets = document.querySelectorAll(".target");

let started = false;
let finished = false;
let found = 0;
let startTime = 0;
let elapsed = 0;
let animationId = null;

function formatTime(ms) {
  const tenths = Math.floor(ms / 100);
  const minutes = Math.floor(tenths / 600);
  const seconds = Math.floor(tenths / 10) % 60;
  const decimal = tenths % 10;

  return (
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0") + "." +
    decimal
  );
}

function updateTimer() {
  if (!started || finished) return;

  elapsed = performance.now() - startTime;
  timer.textContent = formatTime(elapsed);

  animationId = requestAnimationFrame(updateTimer);
}

function startTimer() {
  if (started || finished) return;

  started = true;
  startTime = performance.now() - elapsed;

  startButton.disabled = true;
  message.textContent = "間違いを探してください！";

  updateTimer();
}

startButton.addEventListener("click", startTimer);

targets.forEach((target) => {
  target.addEventListener("click", () => {
    if (finished || target.classList.contains("found")) {
      return;
    }

    // 最初のクリックでタイマーを開始
    if (!started) {
      startTimer();
    }

    target.classList.add("found");
    target.disabled = true;
    found++;

    count.textContent =
      "見つけた間違い：" + found + " / 8";

    if (found === 8) {
      finished = true;
      elapsed = performance.now() - startTime;

      cancelAnimationFrame(animationId);

      timer.textContent = formatTime(elapsed);
      message.textContent =
        "クリア！ タイム：" + formatTime(elapsed);

      startButton.disabled = true;
    }
  });
});

resetButton.addEventListener("click", () => {
  cancelAnimationFrame(animationId);

  started = false;
  finished = false;
  found = 0;
  elapsed = 0;
  startTime = 0;

  timer.textContent = "00:00.0";
  count.textContent = "見つけた間違い：0 / 8";
  message.textContent = "スタートを押して始めてください。";

  startButton.disabled = false;

  targets.forEach((target) => {
    target.classList.remove("found");
    target.disabled = false;
  });
});
</script>

</body>
</html>
