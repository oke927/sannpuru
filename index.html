<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>間違い探しゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.2rem;
      color: #2c3e50;
    }

    .status-panel {
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .timer-box {
      color: #e74c3c;
    }

    .score-box {
      color: #27ae60;
    }

    /* ゲームエリア */
    .game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .game-image {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 正解マーカー (赤い円) */
    .marker {
      position: absolute;
      border: 3px solid #ff2a2a;
      background-color: rgba(255, 42, 42, 0.25);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pop 0.3s ease-out;
    }

    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* クリアモーダルダイアログ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: white;
      padding: 25px 35px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-content h2 {
      color: #27ae60;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .modal-content p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .btn-retry {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-retry:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <header>
    <h1>間違い探し（8箇所見つけよう！）</h1>
    <div class="status-panel">
      <div class="score-box">発見: <span id="found-count">0</span> / 8</div>
      <div class="timer-box">タイム: <span id="timer-display">00:00.0</span></div>
    </div>
  </header>

  <main class="game-container" id="game-container">
    <!-- 同じフォルダ内の game-image.png を読み込みます -->
    <img src="game-image.png" id="game-image" class="game-image" alt="間違い探し画像">
  </main>

  <!-- クリア画面モーダル -->
  <div class="modal-overlay" id="clear-modal">
    <div class="modal-content">
      <h2>🎉 GAME CLEAR! 🎉</h2>
      <p>8箇所の間違いを発見しました！</p>
      <p>クリアタイム: <strong id="final-time" style="color: #e74c3c;">00:00.0</strong></p>
      <button class="btn-retry" onclick="resetGame()">もう一度挑戦する</button>
    </div>
  </div>

  <script>
    // 画像上の間違い箇所10個の定義（％指定：[X%, Y%, 判定半径%]）
    const DIFFERENCES = [
      { id: 1,  x: 55.0, y: 8.5,  radius: 3.5 }, // 1. KidsMenuの「d」の文字
      { id: 2,  x: 62.2, y: 26.5, radius: 3.0 }, // 2. 背景のカップ／ジュース
      { id: 3,  x: 71.0, y: 28.0, radius: 3.0 }, // 3. ドレッシングボトル（振りかけ）
      { id: 4,  x: 88.5, y: 29.5, radius: 3.0 }, // 4. 背景のカップサーバー／持ち手
      { id: 5,  x: 96.0, y: 53.0, radius: 4.5 }, // 5. ひつじのキャラクター（消えている）
      { id: 6,  x: 65.5, y: 60.5, radius: 3.5 }, // 6. オリーブオイルのボトルキャップ
      { id: 7,  x: 91.8, y: 62.5, radius: 3.0 }, // 7. 女の子のリボンの色
      { id: 8,  x: 56.5, y: 68.5, radius: 3.5 }, // 8. シュノーケル帽子の男の子の目
      { id: 9,  x: 60.8, y: 82.5, radius: 3.5 }, // 9. 看板（Make Your Favorite）の欠け
      { id: 10, x: 82.5, y: 84.5, radius: 4.0 }  // 10. 唐辛子ボトルのラベル／色
    ];

    let foundIds = new Set();
    let startTime = null;
    let timerInterval = null;
    let isFinished = false;

    const gameContainer = document.getElementById('game-container');
    const foundCountEl = document.getElementById('found-count');
    const timerDisplayEl = document.getElementById('timer-display');
    const clearModal = document.getElementById('clear-modal');
    const finalTimeEl = document.getElementById('final-time');

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 100);
    }

    function updateTimer() {
      if (!startTime) return;
      const elapsedMs = Date.now() - startTime;
      timerDisplayEl.textContent = formatTime(elapsedMs);
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const tenths = Math.floor((ms % 1000) / 100);

      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');
      return `${mStr}:${sStr}.${tenths}`;
    }

    gameContainer.addEventListener('click', (e) => {
      if (isFinished) return;

      if (!startTime) {
        startTimer();
      }

      const rect = gameContainer.getBoundingClientRect();
      const clickXPercent = ((e.clientX - rect.left) / rect.width) * 100;
      const clickYPercent = ((e.clientY - rect.top) / rect.height) * 100;

      for (const diff of DIFFERENCES) {
        if (foundIds.has(diff.id)) continue;

        const dx = clickXPercent - diff.x;
        const dy = clickYPercent - diff.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance <= diff.radius) {
          foundIds.add(diff.id);
          addMarker(diff.x, diff.y, diff.radius);
          updateScore();
          break;
        }
      }
    });

    function addMarker(xPercent, yPercent, radiusPercent) {
      const marker = document.createElement('div');
      marker.className = 'marker';
      
      const width = gameContainer.clientWidth;
      const sizePx = (radiusPercent * 2 / 100) * width;

      marker.style.left = `${xPercent}%`;
      marker.style.top = `${yPercent}%`;
      marker.style.width = `${Math.max(sizePx, 24)}px`;
      marker.style.height = `${Math.max(sizePx, 24)}px`;

      gameContainer.appendChild(marker);
    }

    function updateScore() {
      const count = foundIds.size;
      foundCountEl.textContent = count;

      if (count >= 8) {
        finishGame();
      }
    }

    function finishGame() {
      isFinished = true;
      clearInterval(timerInterval);
      const elapsedMs = Date.now() - startTime;
      const formattedTime = formatTime(elapsedMs);

      finalTimeEl.textContent = formattedTime;
      setTimeout(() => {
        clearModal.classList.add('active');
      }, 300);
    }

    function resetGame() {
      foundIds.clear();
      isFinished = false;
      startTime = null;
      clearInterval(timerInterval);

      foundCountEl.textContent = '0';
      timerDisplayEl.textContent = '00:00.0';
      clearModal.classList.remove('active');

      const markers = document.querySelectorAll('.marker');
      markers.forEach(m => m.remove());
    }
  </script>
</body>
</html>
